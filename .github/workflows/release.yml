name: Release Binary

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '1.0.0'

jobs:
  build-and-release:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Extract version from tag
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Build Universal Binary
      run: |
        chmod +x .github/scripts/build-release.sh
        .github/scripts/build-release.sh "${{ steps.version.outputs.version }}"

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body: |
          ## 🚀 Release ${{ steps.version.outputs.version }}
          
          ### Downloads
          - **csv2img-mac.tar.gz**: Universal macOS binary (Intel + Apple Silicon)
          
          ### Checksums
          - SHA256: `${{ env.sha256 }}`
          
          ### Installation
          ```bash
          # Download and extract
          curl -L -o csv2img-mac.tar.gz https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/csv2img-mac.tar.gz
          tar -xzf csv2img-mac.tar.gz
          
          # Make executable and move to PATH
          chmod +x csv2img
          sudo mv csv2img /usr/local/bin/
          ```
          
          ### Verification
          ```bash
          # Verify checksum
          echo "${{ env.sha256 }}  csv2img-mac.tar.gz" | shasum -a 256 -c
          
          # Test installation
          csv2img --help
          ```
        files: |
          csv2img-mac.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: csv2img-binary-${{ steps.version.outputs.version }}
        path: |
          csv2img-mac.tar.gz
        retention-days: 30