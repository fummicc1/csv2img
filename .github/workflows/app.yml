name: "[Csv2ImageApp] Build App"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  build_app:
    name: "Build Csv2ImageApp"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        if: ${{ env.LOCAL != 'true' }}
        with:
          xcode-version: latest-stable
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: Build (macOS)
        run: |
          set -o pipefail && \
          xcodebuild -project Csv2ImageApp/Csv2ImageApp.xcodeproj \
          -scheme Csv2ImageApp \
          clean build \
          -destination 'platform=macOS,arch=arm64' \
          CODE_SIGNING_ALLOWED=NO \
          | xcbeautify
      - name: Test (macOS)
        run: |
          set -o pipefail && \
          xcodebuild -project Csv2ImageApp/Csv2ImageApp.xcodeproj \
          -scheme Csv2ImageApp \
          test \
          -only-testing:Csv2ImageAppTests \
          -destination 'platform=macOS,arch=arm64' \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM= \
          PROVISIONING_PROFILE_SPECIFIER= \
          | xcbeautify
      - name: Build (iOS)
        run: |
          set -o pipefail && \
          xcodebuild -project Csv2ImageApp/Csv2ImageApp.xcodeproj \
          -scheme Csv2ImageApp \
          clean build \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGNING_ALLOWED=NO \
          | xcbeautify
